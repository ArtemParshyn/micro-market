  app_catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    command: [ "sh", "-c", "alembic -c services/catalog/migrations/alembic.ini upgrade head && uvicorn services.catalog.main:app --host 0.0.0.0 --port 8000" ]
    env_file:
      - services/catalog/.env
    ports:
      - "8000:8000"
    depends_on:
      db_catalog:
        condition: service_healthy

  db_catalog:
    image: postgres:16-alpine
    env_file: services/catalog/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

